<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <!-- アイコンはすべて scripts/gen_brand_assets.py が生成する（手で描き直さない） -->
    <!-- iOS はマニフェストの icons を見ないため、ホーム画面追加用に明示指定 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- タブは 16〜32px。4×4 のままだと模様に潰れるので 3×3 に間引いた compact 版を使う -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <title>Vocab Trainer</title>
    <meta name="description" content="語彙特化の学習アプリ。英語・日本語のコースを FSRS で回す。" />
    <!-- リンク共有時のカード。本番は Cloudflare Access の内側なので外部クローラーは取得できないが、
         社内で URL を貼ったときや将来公開したときのために置いておく -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vocab Trainer" />
    <meta property="og:description" content="語彙特化の学習アプリ｜英語・日本語" />
    <meta property="og:image" content="./og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // テーマを描画前に確定（ちらつき防止）: 保存値 → 無ければシステム設定
      ;(function () {
        try {
          var s = localStorage.getItem('vocab-theme')
          var mode = s === 'light' || s === 'dark' ? s : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = mode
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
